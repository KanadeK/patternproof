name: Feature request
description: Propose one evidence-backed workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe the real maker workflow and what currently fails.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Minimum successful outcome
      description: Explain what evidence would prove the problem is solved.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Compatibility or privacy constraints
      description: Note any schema, offline, or capture-contract impact.
